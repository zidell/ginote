name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Svelte
        run: npm run check

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  # 테스트를 통과한 빌드를 서명해 GitHub Pages에 올린다. 설치형 앱도 이 빌드를 받는다.
  deploy-web:
    name: Deploy web
    needs: test
    if: github.repository == 'zidell/ginote' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: deploy-web
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 서명 없이 배포하면 앱이 조용히 업데이트를 멈추므로, 키가 없으면 배포하지 않는다.
      # 잠금 pepper는 저장소 변수 VITE_NOTE_LOCK_PEPPER가 있으면 그 값, 없으면 소스 기본값이다
      # (docs/ENCRYPTION.md).
      - name: Build and sign
        env:
          GINOTE_OTA_SIGNING_KEY: ${{ secrets.GINOTE_OTA_SIGNING_KEY }}
          VITE_NOTE_LOCK_PEPPER: ${{ vars.VITE_NOTE_LOCK_PEPPER }}
        run: |
          if [ -z "$GINOTE_OTA_SIGNING_KEY" ]; then
            echo "::error::GINOTE_OTA_SIGNING_KEY secret is missing."
            exit 1
          fi
          npm run build
          test -s dist/app-manifest.json.sig

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
