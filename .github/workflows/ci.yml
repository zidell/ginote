name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Svelte
        run: npm run check

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: npm run build

  # main의 웹 빌드는 여기서만 만든다. 테스트를 통과한 빌드에 서명해 Cloudflare Worker에 올리면
  # 설치된 앱도 다음 실행 때 같은 빌드로 바뀐다(docs/APP_OTA.md). 앱 패키징은 release.yml이 한다.
  deploy-web:
    name: Deploy web
    needs: test
    if: github.repository == 'zidell/ginote' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 서명 없이 배포하면 앱이 조용히 업데이트를 멈추므로, 키가 없으면 배포하지 않는다.
      - name: Build and sign
        env:
          GINOTE_OTA_SIGNING_KEY: ${{ secrets.GINOTE_OTA_SIGNING_KEY }}
        run: |
          if [ -z "$GINOTE_OTA_SIGNING_KEY" ]; then
            echo "::error::GINOTE_OTA_SIGNING_KEY secret is missing."
            exit 1
          fi
          npm run build
          test -s dist/app-manifest.json.sig

      # 설정은 wrangler.jsonc(Worker 이름, dist, SPA 대체 응답)에 있다.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          command: deploy
