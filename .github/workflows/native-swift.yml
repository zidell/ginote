name: Swift native tests

on:
  push:
    branches: [main]
    paths: ['macos/**', '.github/workflows/native-swift.yml']
  pull_request:
    paths: ['macos/**', '.github/workflows/native-swift.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci
      - name: Core tests
        working-directory: macos/Packages/GinoteCore
        run: GINOTE_NODE="$(command -v node)" swift test
      - run: brew install xcodegen
      - name: App model tests
        working-directory: macos
        run: |
          xcodegen
          xcodebuild -quiet -project GinoteNative.xcodeproj -scheme Ginote -derivedDataPath build/test-derived -destination 'platform=macOS' test
