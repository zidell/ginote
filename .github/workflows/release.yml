name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 0.1.${{ github.run_number }}

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or find draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ env.RELEASE_VERSION }}
          RELEASE_NAME: Ginote v${{ env.RELEASE_VERSION }}
          RELEASE_BODY: Download the installer for your platform. These builds are not notarized or code-signed.
        run: |
          release_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id" |
            head -n 1
          )"

          if [ -z "$release_id" ]; then
            release_id="$(
              gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$RELEASE_NAME" \
              -f body="$RELEASE_BODY" \
              -F draft=true \
              -F prerelease=false \
              --jq .id
            )"
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Set automatic release version
        run: npm version "${{ env.RELEASE_VERSION }}" --no-git-tag-version --allow-same-version

      - name: Check and test frontend
        run: |
          npm run check
          npm test

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: v${{ env.RELEASE_VERSION }}
          releaseName: Ginote v${{ env.RELEASE_VERSION }}
          releaseBody: Download the installer for your platform. These builds are not notarized or code-signed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    name: Publish desktop release
    needs: [prepare-release, release]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            >/dev/null

  prune-releases:
    name: Keep the latest 20 releases
    needs: publish-release
    runs-on: ubuntu-22.04
    steps:
      - name: Delete older releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --repo "$GH_REPO" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
          while IFS= read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes
          done
