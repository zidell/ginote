name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.1.${{ github.run_number }}

jobs:
  # Publishing is intentionally restricted to the canonical repository. Forks
  # may run CI, but must not create releases or update distribution channels.
  prepare-release:
    name: Prepare draft release
    if: github.repository == 'zidell/ginote'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or find draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ env.RELEASE_VERSION }}
          RELEASE_NAME: Ginote v${{ env.RELEASE_VERSION }}
          RELEASE_BODY: Download the installer for your platform. macOS builds are signed and notarized; Windows and Linux builds are not code-signed.
        run: |
          release_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id" |
            head -n 1
          )"

          if [ -z "$release_id" ]; then
            release_id="$(
              gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$RELEASE_NAME" \
              -f body="$RELEASE_BODY" \
              -F draft=true \
              -F prerelease=false \
              --jq .id
            )"
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare-release
    if: github.repository == 'zidell/ginote'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Set automatic release version
        run: npm version "${{ env.RELEASE_VERSION }}" --no-git-tag-version --allow-same-version

      - name: Check and test frontend
        run: |
          npm run check
          npm test

      # Tauri 번들러는 APPLE_CERTIFICATE 등 환경변수가 존재하기만 해도(빈 문자열이어도)
      # 서명을 시도해 빈 인증서 import에 실패한다. 시크릿이 실제로 채워진 경우에만
      # GITHUB_ENV에 등록해 env var 자체가 생기지 않도록 한다.
      - name: Configure macOS signing env
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: v${{ env.RELEASE_VERSION }}
          releaseName: Ginote v${{ env.RELEASE_VERSION }}
          releaseBody: Download the installer for your platform. macOS builds are signed and notarized; Windows and Linux builds are not code-signed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish-release:
    name: Publish desktop release
    needs: [prepare-release, release]
    if: github.repository == 'zidell/ginote'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            >/dev/null

  prune-releases:
    name: Keep the latest 20 releases
    needs: publish-release
    if: github.repository == 'zidell/ginote'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Delete older releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --repo "$GH_REPO" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
          while IFS= read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes
          done

  update-cask:
    name: Update Homebrew cask
    needs: publish-release
    if: github.repository == 'zidell/ginote'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download macOS bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${{ env.RELEASE_VERSION }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*_universal.dmg' \
            --dir dist-dmg \
            --clobber

      - name: Bump Cask formula
        run: |
          dmg_path="$(find dist-dmg -name '*_universal.dmg')"
          sha256="$(shasum -a 256 "$dmg_path" | awk '{print $1}')"
          version="${{ env.RELEASE_VERSION }}"
          sed -i \
            -e "s/^  version \".*\"/  version \"${version}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${sha256}\"/" \
            Casks/ginote.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Casks/ginote.rb; then
            exit 0
          fi
          git add Casks/ginote.rb
          git commit -m "chore: bump Homebrew cask to v${{ env.RELEASE_VERSION }}"
          git pull --rebase origin main
          git push origin HEAD:main
