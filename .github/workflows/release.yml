name: Desktop release

# main에 push하면 데스크톱 앱을 릴리스한다. 화면·기능 수정(웹 빌드)은 설치된 앱이 OTA로 받으므로
# (docs/APP_OTA.md), 네이티브 셸이나 패키징이 바뀐 push만 릴리스한다. 그 밖에 새 릴리스가
# 필요하면 Actions에서 손으로 실행한다.
on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '!src-tauri/gen/**'
      - 'scripts/windows/**'
      - 'scripts/updater-manifest.mjs'
      - '.github/workflows/release.yml'
      - '.github/workflows/windows-msix.yml'
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.1.${{ github.run_number }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  # 원본 저장소의 main에서만 릴리스한다. 포크나 다른 브랜치에서 손으로 실행해도 시작하지 않는다.
  prepare-release:
    name: Prepare draft release
    if: github.repository == 'zidell/ginote' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or find draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v${{ env.RELEASE_VERSION }}
          RELEASE_NAME: Ginote v${{ env.RELEASE_VERSION }}
          RELEASE_BODY: >-
            Download the installer for your platform. macOS builds are signed and notarized; Linux builds are not code-signed.
            Installed macOS and Linux apps offer this release by themselves. Windows gets Ginote from the Microsoft Store.
            The desktop app works offline and updates its interface from https://note.gitools.net automatically.
        run: |
          release_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id" |
            head -n 1
          )"

          if [ -z "$release_id" ]; then
            release_id="$(
              gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG_NAME" \
              -f target_commitish="$RELEASE_SHA" \
              -f name="$RELEASE_NAME" \
              -f body="$RELEASE_BODY" \
              -F draft=true \
              -F prerelease=false \
              --jq .id
            )"
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare-release
    if: needs.prepare-release.result == 'success'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Set automatic release version
        run: npm version "${{ env.RELEASE_VERSION }}" --no-git-tag-version --allow-same-version

      - name: Check and test frontend
        run: |
          npm run check
          npm test

      # Tauri 번들러는 APPLE_CERTIFICATE 등 환경변수가 존재하기만 해도(빈 문자열이어도)
      # 서명을 시도해 빈 인증서 import에 실패한다. 시크릿이 실제로 채워진 경우에만
      # GITHUB_ENV에 등록해 env var 자체가 생기지 않도록 한다.
      - name: Configure macOS signing env
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          fi

      # 업데이트 파일(.app.tar.gz, AppImage·deb·rpm)과 그 서명(.sig)도 만든다. latest.json은 두 플랫폼
      # 빌드가 서로 덮어쓰지 않도록 여기서 만들지 않고 publish-release에서 한 번에 만든다.
      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 앱에 함께 들어가는 웹 빌드의 잠금 pepper. 공식 사이트(ci.yml)와 같은 값이다.
          VITE_NOTE_LOCK_PEPPER: ${{ vars.VITE_NOTE_LOCK_PEPPER }}
          # 릴리스 빌드라는 표시. 이 값이 없는 빌드(로컬 빌드)는 앱 업데이트를 확인하지 않는다(release_update.rs).
          GINOTE_RELEASE_BUILD: '1'
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: v${{ env.RELEASE_VERSION }}
          releaseName: Ginote v${{ env.RELEASE_VERSION }}
          releaseBody: >-
            Download the installer for your platform. macOS builds are signed and notarized; Linux builds are not code-signed.
            Installed macOS and Linux apps offer this release by themselves. Windows gets Ginote from the Microsoft Store.
            The desktop app works offline and updates its interface from https://note.gitools.net automatically.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  # Windows는 MSIX로 묶어 Microsoft Store에 올린다(docs/DESKTOP.md). 설치 파일을 GitHub 릴리스에
  # 올리지 않으므로 macOS·Linux 게시를 기다리게 하지 않는다.
  windows-msix:
    name: Windows MSIX
    needs: prepare-release
    if: needs.prepare-release.result == 'success'
    uses: ./.github/workflows/windows-msix.yml
    with:
      version: 0.1.${{ github.run_number }}
      ref: ${{ github.sha }}

  publish-release:
    name: Publish desktop release
    needs: [prepare-release, release]
    if: >-
      always() &&
      needs.prepare-release.result == 'success' &&
      needs.release.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      # 설치된 macOS·Linux 앱의 업데이터가 읽는 목록(src-tauri/tauri.conf.json의 plugins.updater).
      - name: Publish updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.sig' --dir updater-signatures --clobber
          node scripts/updater-manifest.mjs updater-signatures "${RELEASE_VERSION}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}" > latest.json
          gh release upload "v${RELEASE_VERSION}" latest.json --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            >/dev/null

  prune-releases:
    name: Keep the latest 20 releases
    needs: publish-release
    if: always() && needs.publish-release.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Delete older releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --repo "$GH_REPO" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
          while IFS= read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes
          done

  update-cask:
    name: Update Homebrew cask
    needs: publish-release
    if: always() && needs.publish-release.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Download macOS bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v${{ env.RELEASE_VERSION }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern '*_universal.dmg' \
            --dir dist-dmg \
            --clobber

      - name: Bump Cask formula
        run: |
          dmg_path="$(find dist-dmg -name '*_universal.dmg')"
          sha256="$(shasum -a 256 "$dmg_path" | awk '{print $1}')"
          version="${{ env.RELEASE_VERSION }}"
          sed -i \
            -e "s/^  version \".*\"/  version \"${version}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${sha256}\"/" \
            Casks/ginote.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Casks/ginote.rb; then
            exit 0
          fi
          git add Casks/ginote.rb
          git commit -m "chore: bump Homebrew cask to v${{ env.RELEASE_VERSION }}"
          git pull --rebase origin main
          git push origin HEAD:main
