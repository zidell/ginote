# XcodeGen 정의(macos/DESIGN.md §3). `xcodegen`으로 GinoteNative.xcodeproj를 만든다(커밋하지 않음).
name: GinoteNative
options:
  bundleIdPrefix: net.gitools
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: ko
  createIntermediateGroups: true
packages:
  GinoteCore:
    path: Packages/GinoteCore
  Markdown:
    url: https://github.com/swiftlang/swift-markdown.git
    from: 0.5.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Ginote:
    type: application
    # 서명은 Signing.xcconfig(기본 임시 서명)와 기기별 Signing.local.xcconfig에서 정한다.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    platform: macOS
    sources:
      - path: Ginote
        excludes:
          - Generated/**
      - path: Ginote/Generated/LockPepper.swift
        optional: true
        group: Ginote/Generated
    dependencies:
      - package: GinoteCore
      - package: Markdown
    preBuildScripts:
      # 잠금 pepper: 빌드 환경변수 → 저장소 루트의 dotenv 파일들 → 소스 기본값(§7).
      - name: Lock pepper
        script: bash "$SRCROOT/scripts/lock-pepper.sh" "$SRCROOT/Ginote/Generated/LockPepper.swift"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Ginote/Generated/LockPepper.swift
    settings:
      base:
        PRODUCT_NAME: Ginote Native
        EXECUTABLE_NAME: Ginote
        PRODUCT_BUNDLE_IDENTIFIER: net.gitools.note.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ginote Native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 음성 노트를 녹음하려면 마이크가 필요합니다.
        INFOPLIST_KEY_NSHumanReadableCopyright: MIT License
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        DEAD_CODE_STRIPPING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  # 화면 모델 단위 테스트. 앱을 호스트로 띄우지만 창·Dock·포커스는 쓰지 않는다(AppModel.isUnitTest).
  # GitHub는 GinoteCore 패키지의 GinoteTestSupport(FakeGitHub, 메모리 서버)로 바꿔 끼운다.
  GinoteTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: GinoteTests
    dependencies:
      - target: Ginote
      - package: GinoteCore
      - package: GinoteCore
        product: GinoteTestSupport
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.gitools.note.mac.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ginote Native.app/Contents/MacOS/Ginote"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Ginote:
    build:
      targets:
        Ginote: all
        GinoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GinoteTests
    archive:
      config: Release
