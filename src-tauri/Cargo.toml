[package]
name = "ginote"
version = "0.1.0"
description = "A serverless notes app backed by GitHub Issues"
authors = ["zidell"]
edition = "2021"

[lib]
name = "ginote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
ureq = "3"
