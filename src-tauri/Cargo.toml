[package]
name = "ginote"
version = "0.1.0"
description = "A serverless notes app backed by GitHub Issues"
authors = ["zidell"]
edition = "2021"

[lib]
name = "ginote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
ureq = "3"
tauri-plugin-dialog = "2"
keyring-core = "1"

# 자격 증명 저장소는 OS마다 하나씩만 붙인다(src/settings.rs).
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
dirs = "7"
# 앱 자체 업데이트는 macOS·Linux만 쓴다. Windows는 Microsoft Store·App Installer가 맡는다(docs/DESKTOP.md).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
